<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Happy 35th Birthday, Ya Habibi!
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=20"
  >
</head>


<body>

  <main class="welcome-screen">

    <div class="birthday-card">

      <p class="small-text">
        A very special birthday adventure for...
      </p>


      <h1>

        <span class="gradient-text">
          Happy 35th Birthday, Ya Habibi!
        </span>

        <span class="emoji">
          🎉❤️
        </span>

      </h1>


      <h2>
        35 Years Young ✨
      </h2>


      <p class="message">

        Today is all about you.

        I made this little birthday adventure
        so you can choose exactly how you want
        us to celebrate together.

      </p>


      <p class="funny-message">

        You pick the fun.
        I handle the rest. 😌💕

      </p>


      <button id="startButton">

        Start My Birthday Adventure 🎂

      </button>

    </div>

  </main>


  <!-- Main birthday planner -->

  <script src="script.js?v=20"></script>


  <!-- Sends final choices to Formspree -->

  <script src="email.js?v=2"></script>


  <!--
    Every time someone starts from the welcome screen,
    begin with a completely fresh birthday plan.
  -->

  <script>

    document
      .getElementById("startButton")
      .addEventListener(
        "click",
        function () {

          birthdayPlan.celebrationLength = "";
          birthdayPlan.dates = "";
          birthdayPlan.restaurants = [];
          birthdayPlan.activities = [];
          birthdayPlan.gifts = [];
          birthdayPlan.giftNotes = "";

          savePlan();

        },
        true
      );

  </script>


</body>

</html>
